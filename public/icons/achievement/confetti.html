<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confetti</title>
<style>
  :root{ --void:#06080A; }
  html,body{margin:0;padding:0;height:100%;background:var(--void);overflow:hidden;}
  canvas{display:block;position:fixed;inset:0;}
  .replay{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    font-family:'Space Grotesk', Inter, sans-serif;font-weight:600;font-size:13.5px;
    background:#9FE300;color:#06080A;border:none;border-radius:100px;
    padding:11px 22px;cursor:pointer;letter-spacing:0.01em;z-index:10;
    box-shadow:0 10px 30px -8px rgba(159,227,0,0.4);
  }
  .replay:hover{box-shadow:0 0 0 4px rgba(159,227,0,0.18);}
  @media (prefers-reduced-motion: reduce){
    .replay{display:none;}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="replay" id="replay">Replay</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// Brand palette: lime, dim lime, gold (flame accent), off-white, soft teal for contrast
const COLORS = ['#9FE300', '#6EC001', '#F5B94A', '#F4F6F2', '#3E9C8E'];
const SHAPES = ['rect','circle','triangle'];
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let particles = [];
const COUNT = reduceMotion ? 0 : 160;

function rand(min, max){ return Math.random() * (max - min) + min; }

function makeParticle(burst){
  return {
    x: rand(0, W),
    y: burst ? rand(-H * 0.4, -10) : rand(-H, 0),
    size: rand(6, 12),
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
    rotation: rand(0, Math.PI * 2),
    rotSpeed: rand(-0.06, 0.06),
    vy: rand(1.6, 3.4),
    vx: rand(-0.6, 0.6),
    swing: rand(0.6, 1.6),
    swingSpeed: rand(0.01, 0.025),
    swingPhase: rand(0, Math.PI * 2),
    opacity: rand(0.85, 1)
  };
}

function seed(){
  particles = [];
  for(let i=0;i<COUNT;i++) particles.push(makeParticle(true));
}

function drawParticle(p){
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation);
  ctx.globalAlpha = p.opacity;
  ctx.fillStyle = p.color;

  if(p.shape === 'rect'){
    ctx.fillRect(-p.size/2, -p.size/3.2, p.size, p.size/1.6);
  } else if(p.shape === 'circle'){
    ctx.beginPath();
    ctx.arc(0, 0, p.size/2.4, 0, Math.PI*2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(0, -p.size/2);
    ctx.lineTo(p.size/2, p.size/2);
    ctx.lineTo(-p.size/2, p.size/2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

let t = 0;
function tick(){
  ctx.clearRect(0,0,W,H);
  t += 1;

  for(const p of particles){
    p.y += p.vy;
    p.x += p.vx + Math.sin(t * p.swingSpeed + p.swingPhase) * p.swing * 0.05;
    p.rotation += p.rotSpeed;

    if(p.y > H + 20){
      Object.assign(p, makeParticle(false));
      p.y = -20;
    }
    drawParticle(p);
  }
  requestAnimationFrame(tick);
}

seed();
if(!reduceMotion) requestAnimationFrame(tick);
else ctx.clearRect(0,0,W,H);

document.getElementById('replay').addEventListener('click', () => {
  seed();
});
</script>
</body>
</html>
